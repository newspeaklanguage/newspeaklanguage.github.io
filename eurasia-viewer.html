     from this page's server as <docName>.zip; docName may be a path
     (menus/MenuDirectory). ?interpret runs without the compiler.

     It boots as a deployed document page does, through deploy-boot.js
     (canonical in the newspeak repository), told to use Eurasia; that script
     holds the one list of libraries to load. The libraries (web/libs), the VM
     and the image (viewer/base.eus) are staged beside this page by
     scripts/ide.sh and scripts/site-runtime.sh. -->
